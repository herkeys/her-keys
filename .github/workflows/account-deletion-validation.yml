name: Account deletion source validation
on:
  push:
    branches: [codex/account-deletion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:release-identity
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
      - run: npx expo-doctor
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/request-account-deletion/index.ts supabase/functions/restore-account/index.ts supabase/functions/process-account-deletions/index.ts supabase/functions/monitor-account-deletions/index.ts supabase/functions/capture-apple-credential/index.ts supabase/functions/begin-web-deletion/index.ts

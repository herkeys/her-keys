name: Build 2 Gate

on:
  pull_request:
    branches:
      - build/02-gemini-integration
  push:
    branches:
      - build/02-gemini-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build2-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: build2-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Backend environment protection
        run: node --test tests/build2BackendProtection.test.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Expo install check
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Expo public config
        run: npx expo config --type public > /dev/null

      - name: Expo introspect config
        run: npx expo config --type introspect > /dev/null

      - name: Gate passed
        run: echo "Build 2 candidate passed the repository validation gate. No backend deployment is performed by this workflow."

name: Her Keys V2 Integration Gate

on:
  pull_request:
    branches:
      - integration/welcome-tree-auth-runtime
      - repair/v2-audit-safe-closeouts-20261008
  # Build 2A: the candidate is certified by pushing the exact SHA, not by a pull-request merge ref.
  push:
    branches:
      - integration/build2a-candidate
      # iOS Build 2 candidate audit: the same gate on the audit branch's exact pushed SHA. Remove with the branch.
      - audit/ios-build2-candidate
      # Build 2 shared consumer blocker repair (Android + iOS audit repairs converged): the same gate on its exact pushed SHA. Remove with the branch.
      - integration/build2-shared-consumer-repair
      # Her Keys Premium Stage 1: the same gate on its exact pushed SHA. Remove with the branch.
      - feature/herkeys-premium-stage1
      # Owner-approved Pass A convergence: certify the exact integration commit with the same mandatory steps.
      - codex/v2-premium-pass-a
      # Premium-only source certification; no deletion work is included.
      - integration/premium-certification
      - codex/v2-premium-final-config
      - engineering/premium-stage1-completion-20261014
      # Premium source convergence: Stage 1 completion + Pass A account/lifecycle, exact pushed SHA.
      - integration/premium-source-convergence-20261014
      # Premium home and account management (WP-1): the same gate on its exact pushed SHA.
      - feature/premium-home-account-20261014
      # P0 Welcome sign-in repair (PR #21) and its integration with the Premium source candidate, each on its exact SHA.
      - repair/p0-welcome-auth-rc-nonblocking-20261015
      - repair/android-auth-p0-device-20261015
      # P0 auth recovery: every account operation ends (bounded activation, storage, RPC, provider and email), exact pushed SHA.
      - repair/p0-auth-recovery-20261015
      - integration/premium-paywall-layout-20261015
      # Native RevenueCat identity deadline and late-mutation quarantine certification.
      - repair/premium-sdk-identity-fence-20261015
      # Stage 1 server-directed Premium launch UI and truthful feature availability.
      - integration/premium-stage1-feature-ui-20261016
      # Subscription fulfillment readiness, actor isolation, and Premium feature journeys.
      - repair/premium-journey-backend-cert-20261016
      # V2 controlled Production feature rollout and governed paid-checkout-off migration.
      - repair/v2-production-premium-rollout-readiness-20261016
      # UI02 + adaptive appearance + reviewed RC identity safety + AI-consent convergence, exact pushed SHA.
      - integration/v2-ui02dm-rc-ai-convergence-20261016
      # Shared backend repair: validation of the exact pushed SHA only; no deployment or native build.
      - repair/v2-shared-backend-convergence-20261017
      # Shared AI-reporting metadata and controlled revenuecat/AI production convergence, source validation only.
      - repair/v2-ai-reporting-and-prod-convergence-20261017
      # Shared defect closeout: exact pushed source validation only; no deployment or build.
      - repair/v2-shared-defect-closeout-20261019
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herkeys-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: v2-repository-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout full candidate history
        uses: actions/checkout@v4
        with:
          # Meals and integration history guards require historical commits.
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Backend boundary protection
        run: node --test tests/build2BackendProtection.test.mjs

      - name: Release identity guard
        run: npm run verify:release-identity

      - name: TypeScript
        run: npm run typecheck

      - name: Welcome and Premium launch-critical contract tests
        run: node --import ./tests/support/register-ts.mjs --import ./tests/support/register-jsx.mjs --test --test-timeout=120000 --test-force-exit tests/onboardingLayout.test.mjs tests/premiumLaunchState.test.mjs tests/premiumCheckoutSwitch.test.mjs tests/migrationChain.test.mjs tests/meals/boundary.test.mjs tests/premiumDomain/dailyLoadUi.test.mjs tests/premium/clientProvider.test.mjs tests/welcomeAuthFlow.test.mjs tests/consent.test.mjs

      - name: Full application test suite
        run: npm test

      - name: Expo install compatibility
        if: ${{ !cancelled() }}
        run: npx expo install --check

      - name: Expo Doctor
        if: ${{ !cancelled() }}
        run: npx expo-doctor

      - name: Resolved Expo public config
        if: ${{ !cancelled() }}
        run: npx expo config --type public > /dev/null

      - name: Resolved Expo native config
        if: ${{ !cancelled() }}
        run: npx expo config --type introspect > /dev/null

      - name: Evidence boundary
        if: ${{ !cancelled() }}
        run: echo "Repository validation only. Live Her Keys Staging RLS, auth, provider calls, native behavior and migrations require separate certification; nothing was deployed."
